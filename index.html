<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Judging Canvas</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="ui-container">
    <div id="timer"></div>
    <div id="prompt">START A CHALLENGE TO DISAPPOINT ME.</div>
    
    <canvas id="paintCanvas" width="600" height="350"></canvas>

    <div class="controls">
        <button id="startBtn">NEW CHALLENGE</button>
        <button id="judgeBtn">RATE MY ART🫠</button>
        <button id="clearBtn">WIPE THE TRASH</button>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
